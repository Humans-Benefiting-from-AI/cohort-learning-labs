<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{COMPONENT_NAME}} - UI Component</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            padding: 20px;
        }

        .component-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .component-header {
            background: #111827;
            color: white;
            padding: 16px 24px;
            border-bottom: 1px solid #374151;
        }

        .component-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .component-description {
            font-size: 14px;
            color: #d1d5db;
        }

        .component-preview {
            padding: 0;
        }

        /* Component-specific styles go here */
        {{COMPONENT_STYLES}}

        .component-info {
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            padding: 16px 24px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="component-container">
        <div class="component-header">
            <div class="component-title">{{COMPONENT_NAME}}</div>
            <div class="component-description">{{COMPONENT_DESCRIPTION}}</div>
        </div>

        <div class="component-preview">
            {{COMPONENT_HTML}}
        </div>

        <div class="component-info">
            <strong>Usage:</strong> {{USAGE_NOTES}}
        </div>
    </div>

    <script>
        {{COMPONENT_JAVASCRIPT}}
    </script>
</body>
</html>
